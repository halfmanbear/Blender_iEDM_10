name: Python quality

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install ruff==0.16.7
      - name: Check Python standard
        run: python scripts/check_code_standard.py
      - name: Test quality gate boundaries
        run: python -m unittest tests.test_code_standard
